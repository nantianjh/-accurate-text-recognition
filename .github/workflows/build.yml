name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "unsigned / signed-adhoc / signed-development"
        type: choice
        default: unsigned
        options:
          - unsigned
          - signed-adhoc
          - signed-development
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        if: ${{ inputs.mode == 'unsigned' || github.event_name == 'push' }}
        run: |
          xcodebuild -project TiYanGuan.xcodeproj \
            -scheme TiYanGuan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TiYanGuan.app Payload/
          zip -qr TiYanGuan-unsigned.ipa Payload

      - name: Import certificate
        if: ${{ startsWith(inputs.mode, 'signed') }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profiles
        if: ${{ startsWith(inputs.mode, 'signed') }}
        env:
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.EXT_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo -n "$APP_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/TiYanGuan-App.mobileprovision"
          echo -n "$EXT_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/TiYanGuan-Ext.mobileprovision"

      - name: Archive (signed)
        if: ${{ startsWith(inputs.mode, 'signed') }}
        run: |
          xcodebuild -project TiYanGuan.xcodeproj \
            -scheme TiYanGuan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            archive -archivePath "$RUNNER_TEMP/TiYanGuan.xcarchive"

      - name: Export ipa (signed)
        if: ${{ startsWith(inputs.mode, 'signed') }}
        run: |
          if [ "${{ inputs.mode }}" = "signed-development" ]; then METHOD=development; else METHOD=ad-hoc; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificates</key>
            <array><string>Apple Development</string></array>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TiYanGuan.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Collect ipa
        if: ${{ startsWith(inputs.mode, 'signed') }}
        run: cp "$RUNNER_TEMP/export/"*.ipa ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYanGuan-${{ inputs.mode || 'unsigned' }}
          path: |
            *.ipa
          if-no-files-found: error