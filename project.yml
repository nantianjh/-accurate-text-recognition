name: TiYanGuan
options:
  bundleIdPrefix: com.debugpapple
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual

targets:
  TiYanGuan:
    type: application
    platform: iOS
    sources:
      - path: TiYanGuan
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    dependencies:
      - target: ShareExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugpapple.tiyanguan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PROVISIONING_PROFILE_SPECIFIER: TiYanGuan-App
        CODE_SIGN_ENTITLEMENTS: TiYanGuan/TiYanGuan.entitlements
    entitlements:
      path: TiYanGuan/TiYanGuan.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.debugpapple.tiyanguan
    info:
      path: TiYanGuan/Info.plist
      properties:
        CFBundleDisplayName: 体验官
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debugpapple.tiyanguan.ShareExtension
        PROVISIONING_PROFILE_SPECIFIER: TiYanGuan-Ext
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.debugpapple.tiyanguan
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 体验官提取
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1

schemes:
  TiYanGuan:
    build:
      targets:
        TiYanGuan: all
    run:
      config: Debug
    archive:
      config: Release